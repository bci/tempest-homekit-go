version: '3.8'

services:
  tempest-homekit-go:
    build: .
    ports:
      - "8080:8080"  # Web dashboard
      - "51826:51826"  # HomeKit (if needed)
    environment:
      # Core configuration
      - TEMPEST_TOKEN=${TEMPEST_TOKEN}
      - TEMPEST_STATION_NAME=${TEMPEST_STATION_NAME:-Chino Hills}
      - WEB_PORT=8080
      - LOG_LEVEL=info

      # Optional: Uncomment and set as needed
      # - SENSORS=temp,lux,humidity,uv
      # - UNITS=imperial
      # - STATUS=true
      # - DISABLE_INTERNET=false
      # - UDP_STREAM=false

      # Alarm configuration (if using)
      # - ALARMS=@tempest-alarms.json

      # Email/SMS configuration (set in .env file)
      # - SMTP_HOST=...
      # - etc.

    volumes:
      # Mount local .env file for configuration
      - ./.env:/home/appuser/.env:ro
      # Mount alarm config if using
      - ./tempest-alarms.json:/home/appuser/tempest-alarms.json:ro
      # Mount database directory for HomeKit persistence
      - ./db:/home/appuser/db

    restart: unless-stopped

    # Optional: Add healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s